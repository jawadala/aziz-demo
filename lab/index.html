<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMPUTATIONAL STUDIES — Index</title>
<style>
:root{--bg:#05060f;--cyan:#00e5ff;--violet:#7c4dff;--green:#00ffa3;--text:#e8ecf8;--muted:#8a93b2;--edge:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:4rem clamp(1rem,5vw,5rem)}
header{margin-bottom:3.5rem}
.kicker{color:var(--cyan);letter-spacing:.45em;text-transform:uppercase;font-size:.72rem;margin-bottom:1rem}
h1{font-size:clamp(2.2rem,6vw,4.5rem);font-weight:900;letter-spacing:-.02em;line-height:1.02;background:linear-gradient(135deg,var(--cyan),var(--text) 50%,var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lead{color:var(--muted);margin-top:1rem;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.2rem}
.card{background:rgba(255,255,255,.035);border:1px solid var(--edge);border-radius:16px;padding:1.5rem;text-decoration:none;color:var(--text);transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .4s}
.card:hover{transform:translateY(-6px);border-color:rgba(0,229,255,.35);box-shadow:0 20px 50px -16px rgba(0,229,255,.25)}
.card .num{font-size:.7rem;letter-spacing:.3em;color:var(--violet)}
.card h3{font-size:1.05rem;margin:.6rem 0 .4rem;font-weight:700}
.card p{color:var(--muted);font-size:.82rem}
.card .stat{margin-top:.9rem;font-size:.68rem;color:var(--green);letter-spacing:.15em}
.missing{opacity:.35}
footer{margin-top:4rem;text-align:center;color:#3d4562;font-size:.72rem;letter-spacing:.2em}
</style></head><body>
<header>
<div class="kicker">COMPUTATIONAL STUDIES</div>
<h1>COMPUTATIONAL STUDIES<br>CATALOG</h1>
<p class="lead">20 interactive studies. Emergence, optimization, physics, signal processing. One self-contained HTML file each. No dependencies. Runs offline.</p>
</header>
<div class="grid" id="grid"></div>
<footer>JAWAD · COMPUTATIONAL STUDIES · 2026</footer>
<script>
const DEMOS=[
["05","Boids","Collective motion, 3000 agents"],
["06","Flow Fields","Curl-noise particle streams"],
["07","Neural Net Viz","Tiny MLP trained in-browser"],
["08","Evolution Lab","Genetic algorithm, live selection"],
["09","Fourier Drawing","Epicycles trace any path"],
["10","Ray Marching","SDF scenes, soft shadows"],
["11","L-Systems","Plants from rewrite grammar"],
["12","Audio Reactive","WebAudio FFT to visuals"],
["13","Swarm Pathfinding","A*, Dijkstra, Greedy on live grids"],
["14","Molecular Dynamics","Lennard-Jones fluid, Verlet"],
["15","Cellular Music","Life rules to pentatonic notes"],
["16","RL Agent","Tabular Q-learning, live Q-table"],
["17","Marching Squares","Implicit surface contours"],
["18","Verlet Physics","2D cloth and soft bodies"],
["19","Hash Avalanche","SHA-256 diffusion visualized"],
["20","Wave Collapse","Constraint-based tile generation"],
["25","Orbit Sim","N-body gravitational integration, Kepler verification"]
];
const g=document.getElementById('grid');
g.innerHTML=DEMOS.map(([n,t,d])=>{
  const href=n+"-"+t.toLowerCase().replace(/ /g,'-')+".html";
  const f=["01-particle-life","02-lenia-lite","03-slime-mold","04-reaction-diffusion","05-boids-flocking","06-flow-fields","07-neural-net-viz","08-ga-evolution","09-fourier-drawing","10-ray-marching","11-l-systems","12-audio-reactive","13-swarms-pathfinding","14-md-simulation","15-cellular-music","16-rl-agent","17-marching-squares","18-verlet-physics","19-sha-visualizer","20-wfc-tiles"].includes(href.replace('.html',''))?1:0;
  return `<a class="card" href="${href}"><div class="num">STUDY No. ${n}</div><h3>${t}</h3><p>${d}</p><div class="stat">STUDY →</div></a>`;
}).join('');
</script>
</body></html>
