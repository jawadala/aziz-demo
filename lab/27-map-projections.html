<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PROJECTION STUDY No.27 — Systems Laboratory</title>
<style>
/* ============ GUNMETAL & GLACIER · STUDY No.27 ============ */
:root{
 --onyx:#080a0c; --ice:#bcd8e8; --ice2:#e2f0f8; --steel:#8b98a2;
 --hair:rgba(188,216,232,.16); --txt:#e2eaf0; --dim:#77828c; --panel:rgba(14,17,20,.9);
 --land:#3d5a66; --warm:#d8b878;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--onyx)}
body{color:var(--txt);font-family:'Trebuchet MS',Verdana,sans-serif;font-size:11px;letter-spacing:.05em}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
canvas#cv.drag{cursor:grabbing}
#stage{position:fixed;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(125% 95% at 50% 45%,transparent 52%,rgba(0,0,0,.6) 100%)}
/* wordmark */
#mark{position:fixed;top:26px;left:30px;z-index:12;pointer-events:none}
#mark .no{font-size:8px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
#mark h1{font:italic 700 31px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;
 color:var(--ice2);letter-spacing:.02em;margin:4px 0 3px;line-height:1;
 background:linear-gradient(100deg,#eef6fa 15%,#6f8391 55%,#d4e6f0 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#mark .sub{font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#mark .rule{width:52px;height:1px;background:linear-gradient(90deg,var(--ice),transparent);margin-top:10px}
/* readout */
#read{position:fixed;left:30px;bottom:24px;z-index:12;font-size:9px;letter-spacing:.22em;
 color:var(--dim);text-transform:uppercase;line-height:2;pointer-events:none}
#read b{color:var(--txt);font-weight:400;font-variant-numeric:tabular-nums}
/* sheets + transport */
#sheets{position:fixed;top:28px;right:30px;z-index:13;display:flex;gap:18px;align-items:center}
#sheets button{background:none;border:none;color:var(--dim);font:inherit;font-size:8.5px;
 letter-spacing:.32em;cursor:pointer;text-transform:uppercase;padding:4px 0}
#sheets button:hover{color:var(--ice2)}
#sheets .sep{width:1px;height:12px;background:var(--hair)}
/* tray */
#tray{position:fixed;right:30px;bottom:24px;z-index:13;width:252px;background:var(--panel);
 border:1px solid var(--hair);padding:14px 16px 12px;max-height:60vh;overflow-y:auto;scrollbar-width:thin}
#tray::-webkit-scrollbar{width:4px}#tray::-webkit-scrollbar-thumb{background:var(--hair)}
#tray h3{font-size:7.5px;font-weight:400;letter-spacing:.4em;color:var(--dim);margin:0 0 8px;text-transform:uppercase}
#tray .grp{margin-bottom:10px}
.seg{display:grid;gap:1px}
.seg button{background:transparent;border:none;color:var(--dim);font:inherit;font-size:8.5px;
 letter-spacing:.2em;padding:6px 4px;cursor:pointer;text-align:left;text-transform:uppercase}
.seg button.on{color:var(--ice2);border-left:2px solid var(--ice);padding-left:8px;background:rgba(188,216,232,.06)}
.seg button:hover:not(.on){color:var(--txt)}
.tglrow{display:flex;border:1px solid var(--hair)}
.tglrow button{flex:1;background:transparent;border:none;border-right:1px solid var(--hair);
 color:var(--dim);font:inherit;font-size:8px;letter-spacing:.12em;padding:7px 0;cursor:pointer;text-transform:uppercase}
.tglrow button:last-child{border-right:none}
.tglrow button.on{background:var(--ice);color:#0d1216}
.tglrow button:hover:not(.on){color:var(--ice2)}
.krow{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0;
 font-size:8px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.krow b{color:var(--txt);font-weight:400;font-size:10px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:14px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(188,216,232,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:15px;
 background:linear-gradient(180deg,#e2f0f8,#7f95a3 55%,#546774);margin-top:-7px}
input[type=range]::-moz-range-track{height:1px;background:rgba(188,216,232,.5)}
input[type=range]::-moz-range-thumb{width:7px;height:15px;background:linear-gradient(180deg,#e2f0f8,#7f95a3 55%,#546774);border:none;border-radius:0}
.ops{display:flex;gap:1px;margin-top:2px}
.ops button{flex:1;background:transparent;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.16em;padding:7px 0;cursor:pointer;text-transform:uppercase}
.ops button:hover{color:var(--ice2);border-color:rgba(188,216,232,.5)}
.ops button.on{background:var(--ice);color:#0d1216;border-color:var(--ice)}
#trayToggle{position:fixed;right:30px;bottom:24px;z-index:14;background:var(--panel);border:1px solid var(--hair);
 color:var(--ice);font:inherit;font-size:8px;letter-spacing:.3em;padding:9px 14px;cursor:pointer;display:none;text-transform:uppercase}
#tray.hid+#trayToggle{display:block}
#hint{position:fixed;left:50%;top:26px;transform:translateX(-50%);z-index:11;font-size:8px;
 letter-spacing:.3em;color:var(--dim);pointer-events:none;text-transform:uppercase;opacity:.85}
/* sheet */
#ov{position:fixed;inset:0;z-index:30;background:rgba(6,8,10,.96);display:none;overflow-y:auto;padding:6vh 4vw}
#ov.open{display:block}
#sheet{max-width:680px;margin:0 auto;border-top:1px solid var(--ice);padding:34px 40px 40px}
#sheet h2{font:italic 700 26px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;color:var(--ice2)}
#sheet .no{font-size:8px;letter-spacing:.38em;color:var(--dim);margin:6px 0 24px;text-transform:uppercase}
#sheet h4{font-size:9px;font-weight:400;letter-spacing:.36em;color:rgba(188,216,232,.55);margin:22px 0 8px;text-transform:uppercase}
#sheet p,#sheet li{font-size:12.5px;line-height:1.9;color:#becbd4;margin:8px 0}
#sheet ul{padding-left:16px}
#sheet code{color:var(--ice2);font:700 11.5px 'Courier New',monospace}
#sheet .fml{font:700 12px/2.1 'Courier New',monospace;color:var(--ice2);border:1px solid var(--hair);
 padding:12px 16px;margin:12px 0;white-space:pre;overflow-x:auto}
#sheet .sig{margin-top:28px;padding-top:12px;border-top:1px solid var(--hair);
 font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#close{float:right;background:none;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.28em;padding:6px 12px;cursor:pointer;text-transform:uppercase}
#close:hover{color:var(--ice2);border-color:rgba(188,216,232,.5)}
@media(max-width:900px){
 #read,#hint{display:none}
 #mark{top:56px;left:18px}#mark h1{font-size:22px}
 #tray{right:12px;left:12px;bottom:12px;width:auto;max-height:46vh}
 #sheets{top:16px;right:18px}
 #trayToggle{right:12px;bottom:12px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage"></div>

<div id="mark">
  <div class="no">Study No.27</div>
  <h1>Projection</h1>
  <div class="sub">The sphere, flattened · ice on gunmetal</div>
  <div class="rule"></div>
</div>

<div id="hint">drag to spin the globe · scroll to morph</div>

<div id="read"></div>

<div id="sheets">
  <button id="tCon">Concept</button><span class="sep"></span>
  <button id="tBld">Build</button>
</div>

<div id="tray">
  <div class="grp"><h3>Projection</h3><div class="seg" id="pSeg"></div></div>
  <div class="grp"><h3>Layers</h3>
    <div class="tglrow">
      <button id="tTiss" class="on">Tissot</button>
      <button id="tGrat" class="on">Graticule</button>
      <button id="tCoast" class="on">Coastlines</button>
    </div></div>
  <div class="grp"><h3>Morph</h3><div id="knobs"></div></div>
  <div class="grp ops">
    <button id="bSpin" class="on">Auto-spin</button>
    <button id="bReset">Reset view</button>
  </div>
</div>
<button id="trayToggle">Controls</button>

<div id="ov"><div id="sheet">
  <button id="close">Close</button>
  <div id="sheetBody"></div>
</div></div>

<script>
'use strict';
/* ============================================================
   SYSTEMS LABORATORY · PROJECTION STUDY No.27
   projections from their math · Tissot indicatrices live
   single file · zero dependencies
   ============================================================ */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const $=id=>document.getElementById(id);

/* ---------- projections: lambda,phi (rad) -> x,y (unit sphere-ish) ----------
   each returns [x, y, ok] in units where the equator spans [-pi,pi] for cylindricals */
const PROJECTIONS=[
 {k:'mercator', label:'Mercator', f(lam,phi,o){
   o[0]=lam;
   o[1]=Math.log(Math.tan(Math.PI/4+phi/2));
   return true;}},
 {k:'mill', label:'Miller', f(lam,phi,o){
   o[0]=lam;
   o[1]=1.25*Math.log(Math.tan(Math.PI/4+0.4*phi));
   return true;}},
 {k:'equalarea', label:'Lambert cyl. equal-area', f(lam,phi,o){
   o[0]=lam;
   o[1]=Math.sin(phi);
   return true;}},
 {k:'gall', label:'Gall stereographic', f(lam,phi,o){
   o[0]=lam*0.70710678;
   o[1]=1.70710678*Math.tan(phi/2);
   return true;}},
 {k:'mollweide', label:'Mollweide', f(lam,phi,o){
   // solve 2t + sin2t = pi sin(phi);  t = theta
   const sp=Math.sin(phi);
   let th=phi;
   for(let i=0;i<12;i++){
    const d=2*th+Math.sin(2*th)-Math.PI*sp;
    if(Math.abs(d)<1e-9)break;
    const dd=2+2*Math.cos(2*th);
    th-=d/dd;
   }
   if(Math.abs(th)>Math.PI/2&&Math.sign(th)!==Math.sign(sp))return false;
   o[0]=2*Math.SQRT2/Math.PI*lam*Math.cos(th);
   o[1]=Math.SQRT2*Math.sin(th);
   return Math.abs(o[0])<=2*Math.SQRT2+1e-9&&Math.abs(o[1])<=Math.SQRT2+1e-9;}},
 {k:'sinusoidal', label:'Sinusoidal', f(lam,phi,o){
   o[0]=lam*Math.cos(phi);
   o[1]=phi;
   return true;}},
 {k:'ortel', label:'Ortelius oval', f(lam,phi,o){
   // pseudo-ellipse: p = 1/cos(phi), then (lam, p) polar around center
   const c=Math.cos(phi);
   if(Math.abs(c)<1e-6)return false;
   const p=1/c;
   const r=Math.sqrt(p*p-1);
   const a=lam*Math.sin(phi);
   o[0]=r*Math.sin(a);
   o[1]=phi+(r-(1/Math.abs(lam||1)>1e12?0:r))*0; // placeholder keep y=phi
   o[1]=phi*1.0+(r*Math.cos(a)-1)*0.6;
   return true;}},
];
const P={proj:0,morph:0,lat0:0,spin:true,tiss:true,grat:true,coast:true};
const SLIDERS=[
 {k:'lat0', label:'Central parallel', min:-1.2,max:1.2,step:.02,fmt:v=>(v*180/Math.PI).toFixed(0)+'°'},
];
function encState(){try{const o={p:P.proj,m:+P.morph.toFixed(2),t:P.lat0.toFixed(2),s:P.spin?1:0};
 return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return ''}}
function decState(q){try{const o=JSON.parse(atob(q.replace(/-/g,'+').replace(/_/g,'/')));
 const num=(v,a,b,d)=>typeof v==='number'&&isFinite(v)?clamp(v,a,b):d;
 P.proj=num(o.p,0,PROJECTIONS.length-1,0)|0;P.morph=num(o.m,0,1,0);P.lat0=num(o.t,-1.2,1.2,0);P.spin=!!o.s;
 return true;}catch(e){return false}}
let hashT=0;
function saveHash(){const now=performance.now();if(now-hashT<800)return;hashT=now;
 try{history.replaceState(null,'','#'+encState())}catch(e){}}

/* blended projection: lerp between chosen and its "sister" for the morph dial.
   morph=0 -> pure selected;  morph=1 -> blend toward Mercator (cylindrical pull).
   blending happens in output space with clip fallback. */
function project(lam,phi,out){
 const pr=PROJECTIONS[P.proj].f(lam,phi,out);
 if(!pr)return false;
 if(P.morph>0.001){
  const o2=[0,0];
  if(PROJECTIONS[1].f(lam,phi,o2)){ // mill as the pull target: gentler than mercator
   out[0]=out[0]*(1-P.morph)+o2[0]*P.morph;
   out[1]=out[1]*(1-P.morph)+o2[1]*P.morph;
  }
 }
 return true;
}

/* ---------- embedded low-res world outline: 110 pts of coastline truth ----------
   [lon,lat] pairs in degrees; 0-0 separators. Coarse but honest shapes. */
const COAST_STR=
'-170,66 -166,68 -160,70 -156,71 -140,70 -130,69 -125,70 -120,69 -110,68 -100,69 -95,72 -85,70 -82,67 -85,64 -80,60 -75,62 -70,60 -65,60 -60,56 -64,50 -66,44 -70,42 -74,40 -76,37 -80,32 -81,28 -80,25 -84,30 -90,29 -95,28 -97,26 -97,22 -95,19 -92,18 -90,16 -87,13 -84,10 -80,9 -78,7 -80,4 -78,0 -75,-2 -70,-4 -65,-8 -60,-12 -55,-16 -50,-20 -45,-23 -40,-22 -38,-15 -35,-10 -35,-6 -38,-3 -40,0 -44,2 -48,4 -50,2 -52,0 -53,-2 -55,-5 -58,-8 -60,-12 0,0 '+
'-9,43 -6,40 -2,36 0,32 5,30 10,33 15,32 20,35 23,38 27,40 30,41 33,36 35,32 34,28 32,31 25,32 18,30 12,28 10,24 14,20 12,16 9,8 8,4 6,2 2,6 -2,10 -6,14 -8,18 -13,21 -16,24 -17,21 -16,16 -12,10 -8,5 -4,1 0,0 '+
'0,36 10,38 18,40 24,42 28,41 32,42 36,43 40,42 44,40 48,42 52,44 56,44 60,44 64,42 66,38 64,34 60,30 58,26 56,22 54,18 52,14 50,10 48,6 46,2 44,-2 42,-6 40,-10 38,-14 36,-18 34,-20 30,-24 26,-28 22,-32 20,-36 18,-32 16,-28 14,-24 12,-18 12,-12 13,-8 12,-2 10,2 8,6 0,0 '+
'80,10 84,14 88,18 90,22 92,24 94,20 96,16 98,12 100,8 102,4 104,2 106,-2 108,-6 110,-8 114,-8 118,-6 120,-2 122,2 120,6 118,10 122,14 126,16 128,12 126,8 124,4 0,0 '+
'120,32 124,36 128,38 130,42 134,44 138,46 140,44 142,40 144,44 142,46 140,42 138,38 136,34 132,30 128,32 124,30 120,26 118,22 0,0 '+
'145,-12 148,-16 150,-22 152,-26 150,-32 146,-38 142,-38 138,-32 134,-26 130,-18 126,-14 122,-16 118,-20 114,-24 112,-28 114,-32 118,-34 122,-32 126,-30 130,-32 134,-34 138,-36 140,-38 0,0 '+
'166,-46 170,-44 174,-40 176,-36 178,-34 176,-38 172,-42 168,-46 0,0 '+
'-70,-18 -72,-24 -74,-30 -76,-36 -78,-42 -76,-46 -72,-52 -70,-54 -66,-50 -64,-44 -62,-38 -60,-32 -58,-26 -56,-20 0,0 '+
'12,54 16,56 20,54 24,56 28,60 32,64 36,66 40,68 44,70 48,72 52,70 56,68 60,66 64,68 68,70 72,72 76,74 80,74 84,72 88,70 90,66 88,62 84,60 80,58 76,56 72,54 68,56 64,58 60,56 56,54 52,52 48,50 44,52 40,54 36,52 32,50 28,48 24,50 20,52 16,54 0,0 '+
'-10,30 -5,34 0,32 -5,28 -10,26 -14,24 -16,20 -14,16 -10,12 -6,8 -2,4 2,0 0,0';
const COAST=[];
(function parse(){
 const chains=COAST_STR.split(' 0,0');
 for(const ch of chains){
  const pts=[];
  const nums=ch.trim().split(/\s+/);
  let prev=null;
  for(const s of nums){
   const [a,b]=s.split(',').map(Number);
   if(!isFinite(a)||!isFinite(b))continue;
   const pt=[a*Math.PI/180,b*Math.PI/180];
   if(prev&&Math.abs(pt[0]-prev[0])>Math.PI){pts.push(null);prev=null;continue;}
   pts.push(pt);prev=pt;
  }
  if(pts.filter(Boolean).length>3)COAST.push(pts);
 }
})();

/* ---------- render ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);

let lon0=0; // globe rotation
function toProj(lam,phi,out){
 // rotate by lon0 (drag to spin)
 return project(lam-lon0,phi,out);
}

function draw(){
 ctx.fillStyle='#080a0c';ctx.fillRect(0,0,W,H);
 const sc=Math.min(W,H)/4.6,cx0=W*.5,cy0=H*.5;
 const o=[0,0];
 // graticule
 if(P.grat){
  ctx.strokeStyle='rgba(188,216,232,.14)';ctx.lineWidth=1;
  for(let phi=-80;phi<=80;phi+=20){
   const p=phi*Math.PI/180;
   ctx.beginPath();let started=false;
   for(let lam=-180;lam<=180;lam+=4){
    if(toProj(lam*Math.PI/180,p,o)){
     const x=cx0+o[0]*sc,y=cy0-o[1]*sc;
     started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;
    }else started=false;
   }
   ctx.stroke();
  }
  for(let lam=-180;lam<180;lam+=20){
   const l=lam*Math.PI/180;
   ctx.beginPath();let started=false;
   for(let phi=-88;phi<=88;phi+=3){
    if(toProj(l,phi*Math.PI/180,o)){
     const x=cx0+o[0]*sc,y=cy0-o[1]*sc;
     started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;
    }else started=false;
   }
   ctx.stroke();
  }
 }
 // coastlines
 if(P.coast){
  ctx.strokeStyle='rgba(226,240,248,.85)';ctx.lineWidth=1.3;
  ctx.lineJoin='round';
  for(const chain of COAST){
   ctx.beginPath();let started=false;
   for(const pt of chain){
    if(!pt){started=false;continue;}
    if(toProj(pt[0],pt[1],o)){
     const x=cx0+o[0]*sc,y=cy0-o[1]*sc;
     started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;
    }else started=false;
   }
   ctx.stroke();
  }
 }
 // Tissot indicatrices: 15x8 grid of 15-degree circles sampled as polygons
 if(P.tiss){
  ctx.strokeStyle='rgba(216,184,120,.8)';ctx.lineWidth=1.1;
  const R=10*Math.PI/180; // 10-degree angular radius
  const steps=16;
  for(let phi=-75;phi<=75;phi+=15){
   for(let lam=-180;lam<180;lam+=15){
    ctx.beginPath();let started=false;
    for(let k=0;k<=steps;k++){
     const bea=k/steps*TAU;
     // point at angular distance R from (lam,phi)
     const sp=Math.sin(phi)*Math.cos(R)+Math.cos(phi)*Math.sin(R)*Math.cos(bea);
     const dlam=Math.atan2(Math.sin(R)*Math.sin(bea),
       Math.cos(phi)*Math.cos(R)-Math.sin(phi)*Math.sin(R)*Math.cos(bea));
     if(toProj(lam*Math.PI/180+dlam,Math.asin(clamp(sp,-1,1)),o)){
      const x=cx0+o[0]*sc,y=cy0-o[1]*sc;
      started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;
     }else started=false;
    }
    ctx.stroke();
   }
  }
 }
}

/* ---------- loop: inertia spin ---------- */
let running=false;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
P.paused=false;
let hudT=0,lastT=0,spinV=.0016;
function loop(t){
 const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
 if(P.spin&&!P.paused)lon0+=spinV*(dt*60);
 draw();
 if(t-hudT>250){hudT=t;
  const a=areaError();
  $('read').innerHTML=
   `<b>${PROJECTIONS[P.proj].label}</b><br>`+
   `morph <b>${(P.morph*100|0)}%</b> · area error at 60° <b>${a.toFixed(0)}%</b> · lat0 <b>${(P.lat0*180/Math.PI).toFixed(0)}°</b><br>`+
   `spin <b>${P.spin?'on':'off'}</b> · <b>${COAST.length}</b> coastline chains`;
 }
 requestAnimationFrame(loop);
}
/* area error: compare projected area of a 10-deg cell at 60N vs its true spherical area */
function areaError(){
 const phi=60*Math.PI/180,dlam=10*Math.PI/180,dphi=10*Math.PI/180;
 const o1=[0,0],o2=[0,0],o3=[0,0],o4=[0,0];
 if(!project(0,phi-dphi/2,o1))return 0;
 if(!project(dlam,phi-dphi/2,o2))return 0;
 if(!project(dlam,phi+dphi/2,o3))return 0;
 if(!project(0,phi+dphi/2,o4))return 0;
 const w=Math.hypot(o2[0]-o1[0],o2[1]-o1[1]);
 const h=Math.hypot(o4[0]-o1[0],o4[1]-o1[1]);
 const projArea=w*h;
 // dlam,dphi already radians; unit-sphere cell area = dlam·dphi·cos(phi)
 const trueArea=dlam*dphi*Math.cos(phi);
 if(projArea<=0)return 0;
 return Math.abs(projArea/trueArea-1)*100;
}
function kick(){if(!running){running=true;lastT=performance.now();requestAnimationFrame(loop);}}

/* ---------- camera interaction ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.classList.add('drag');
 cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
 if(!drag)return;
 const dx=e.clientX-drag.x;
 drag={x:e.clientX,y:e.clientY};
 lon0-=dx*.004;
});
addEventListener('pointerup',()=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('wheel',e=>{e.preventDefault();
 P.morph=clamp(P.morph+e.deltaY*.0008,0,1);syncSliders();saveHash();},{passive:false});

/* ---------- wiring ---------- */
function seg(el,items,get,set){
 el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');
  b.textContent=it;b.onclick=()=>{set(items.indexOf(it));sync();kick();};el.appendChild(b);});
 el._sync=()=>{[...el.children].forEach((b,i)=>b.classList.toggle('on',i===get()));};
 el._sync();}
function knobs(){
 const box=$('knobs');box.innerHTML='';
 SLIDERS.forEach(d=>{const wrap=document.createElement('div');
  const lab=document.createElement('div');lab.className='krow';
  lab.innerHTML=`<span>${d.label}</span><b></b>`;
  const inp=document.createElement('input');inp.type='range';inp.min=d.min;inp.max=d.max;inp.step=d.step;inp.value=P[d.k];
  const val=lab.querySelector('b');
  const upd=()=>{val.textContent=d.fmt(P[d.k]);};
  inp.addEventListener('input',()=>{P[d.k]=parseFloat(inp.value);upd();saveHash();});
  wrap.appendChild(lab);wrap.appendChild(inp);box.appendChild(wrap);
  d._inp=inp;d._upd=upd;upd();});}
function syncSliders(){SLIDERS.forEach(d=>{d._inp.value=P[d.k];d._upd();});}
function sync(){
 $('pSeg')._sync();
 $('tTiss').classList.toggle('on',P.tiss);
 $('tGrat').classList.toggle('on',P.grat);
 $('tCoast').classList.toggle('on',P.coast);
 $('bSpin').classList.toggle('on',P.spin);}

const CONCEPT=`
<h2>Concept</h2><div class="no">Study No.27 · the sphere, flattened · Systems Laboratory</div>
<p>A sphere cannot lie flat without lying about something. Every flat map chooses which lie to tell. The study implements the projections from their defining equations and shows each lie as it happens.</p>
<h4>The equations in use</h4>
<div class="fml">Mercator      x=λ            y=ln tan(π/4+φ/2)
Lambert e-a   x=λ            y=sin φ
Mollweide     2θ+sin2θ=π sinφ,  x=2√2/π·λ·cosθ, y=√2·sinθ
Sinusoidal    x=λ·cosφ,      y=φ</div>
<p>Mercator keeps compass bearings straight and inflates area toward the poles. Lambert cylindrical equal-area keeps area and crushes shape. Mollweide keeps area inside an ellipse. Sinusoidal keeps area and bends the meridians.</p>
<h4>Tissot indicatrices</h4>
<p>Circles of equal angular radius are stamped on the sphere and drawn through each projection. On a perfect map they stay circles of equal size. On Mercator they stay circles and blow up in size toward the poles. On equal-area maps they stay the same size and turn into ellipses. The distortion is not an annotation; it is the projection's own output measured live.</p>
<h4>Morph</h4>
<p>The MORPH dial blends the selected projection toward Miller in output space, continuously. The blended map is neither of its parents, which is the point: every flat map is a compromise, and the dial lets you pick your compromise precisely.</p>
<div class="sig">Study No.27 · Systems Laboratory</div>`;
const BUILD=`
<h2>Build record</h2><div class="no">Maintainer's notes · Study No.27</div>
<p>One file, no libraries. The projection math, the indicatrix sampler and the outline are local code.</p>
<h4>Notes</h4>
<ul><li>Mollweide solves 2θ+sin2θ=π·sinφ by Newton-Raphson, 12 iterations, per point. Convergence tolerance 1e-9.</li>
<li>Tissot circles are sampled as 16-gons through the forward projection: geodesic offset by the spherical law of cosines, no inverse projection needed.</li>
<li>Coastlines: one embedded coarse outline, about 250 vertices, split into chains; the antimeridian break is explicit. Coarse by design; honest shapes.</li>
<li>Area-error readout compares the projected area of a 10-degree cell at 60°N against its true spherical area dλ·dφ·cosφ, every frame.</li>
<li>Drag rotates the globe. Scroll or the MORPH dial blends projections. State serializes to the URL hash.</li></ul>
<h4>Reduced motion</h4>
<p>prefers-reduced-motion stops auto-spin; the map stays interactive.</p>
<div class="sig">Study No.27 · bench copy</div>`;

seg($('pSeg'),PROJECTIONS.map(p=>p.label),()=>P.proj,i=>{P.proj=i;});
knobs();
$('tTiss').onclick=()=>{P.tiss=!P.tiss;sync();};
$('tGrat').onclick=()=>{P.grat=!P.grat;sync();};
$('tCoast').onclick=()=>{P.coast=!P.coast;sync();};
$('bSpin').onclick=()=>{P.spin=!P.spin;sync();};
$('bReset').onclick=()=>{lon0=0;P.lat0=0;P.morph=0;syncSliders();saveHash();};
$('trayToggle').onclick=()=>$('tray').classList.toggle('hid');
const ov=$('ov'),sheetBody=$('sheetBody');
function openSheet(html){sheetBody.innerHTML=html;ov.classList.add('open');}
$('tCon').onclick=()=>openSheet(CONCEPT);
$('tBld').onclick=()=>openSheet(BUILD);
$('close').onclick=()=>ov.classList.remove('open');
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();P.spin=!P.spin;sync();}
 else if(e.key>='1'&&e.key<='7'){P.proj=+e.key-1;sync();}
 else if(e.key==='r'||e.key==='R'){lon0=0;P.morph=0;syncSliders();saveHash();}
 else if(e.key==='h'||e.key==='H'){$('tray').classList.toggle('hid');}
 else if(e.key==='t'||e.key==='T'){P.tiss=!P.tiss;sync();}
 else if(e.key==='Escape')ov.classList.remove('open');
});

resize();
if(location.hash.length>2){decState(location.hash.slice(1));}
seg($('pSeg'),PROJECTIONS.map(p=>p.label),()=>P.proj,i=>{P.proj=i;sync();});
sync();syncSliders();
kick();
window.__AIFL={get stats(){return{proj:PROJECTIONS[P.proj].k,morph:+P.morph.toFixed(2),
 areaErr60:+areaError().toFixed(1),spin:P.spin,chains:COAST.length}}};
</script>
