<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ENTROPY STUDY No.26 — Systems Laboratory</title>
<style>
/* ============ GRAPHITE & OXIDIZED SILVER · STUDY No.26 ============ */
:root{
 --onyx:#0a0b0a; --ox:#aeb6b0; --ox2:#d6ddd6; --verd:#7fa88f;
 --hair:rgba(174,182,176,.16); --txt:#e4e8e2; --dim:#828a83; --panel:rgba(15,17,15,.9);
 --bad:#c98268; --good:#9fc9a8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--onyx)}
body{color:var(--txt);font-family:'Trebuchet MS',Verdana,sans-serif;font-size:11px;letter-spacing:.05em}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
#stage{position:fixed;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(120% 90% at 50% 38%,transparent 55%,rgba(0,0,0,.62) 100%)}
/* wordmark */
#mark{position:fixed;top:26px;left:30px;z-index:12;pointer-events:none}
#mark .no{font-size:8px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
#mark h1{font:italic 700 31px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;
 color:var(--ox2);letter-spacing:.02em;margin:4px 0 3px;line-height:1;
 background:linear-gradient(100deg,#eef2ec 15%,#7d8580 55%,#cdd4cc 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#mark .sub{font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#mark .rule{width:52px;height:1px;background:linear-gradient(90deg,var(--ox),transparent);margin-top:10px}
/* hero gauge: center-left, the one unforgettable moment */
#gauge{position:fixed;left:30px;top:170px;z-index:12;text-align:left}
#gauge canvas{display:block}
#gauge .cap{font-size:8px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:6px}
/* verdict line */
#verdict{position:fixed;left:30px;bottom:118px;z-index:12;font-size:9px;letter-spacing:.24em;
 color:var(--dim);text-transform:uppercase;line-height:2;pointer-events:none;max-width:40vw}
#verdict b{color:var(--txt);font-weight:400}
#verdict .warn{color:var(--bad)}
#verdict .fine{color:var(--good)}
/* sheets + transport */
#sheets{position:fixed;top:28px;right:30px;z-index:13;display:flex;gap:18px;align-items:center}
#sheets button{background:none;border:none;color:var(--dim);font:inherit;font-size:8.5px;
 letter-spacing:.32em;cursor:pointer;text-transform:uppercase;padding:4px 0}
#sheets button:hover{color:var(--ox2)}
#sheets .sep{width:1px;height:12px;background:var(--hair)}
/* tray */
#tray{position:fixed;right:30px;bottom:24px;z-index:13;width:290px;background:var(--panel);
 border:1px solid var(--hair);padding:14px 16px 12px;max-height:62vh;overflow-y:auto;scrollbar-width:thin}
#tray::-webkit-scrollbar{width:4px}#tray::-webkit-scrollbar-thumb{background:var(--hair)}
#tray h3{font-size:7.5px;font-weight:400;letter-spacing:.4em;color:var(--dim);margin:0 0 8px;text-transform:uppercase}
#tray .grp{margin-bottom:10px}
/* passphrase field */
#pw{width:100%;background:rgba(228,232,226,.05);border:1px solid var(--hair);color:var(--ox2);
 font:15px 'Courier New',monospace;padding:9px 11px;outline:none;letter-spacing:.04em}
#pw:focus{border-color:var(--ox)}
#pw::placeholder{color:#4a524c;font-size:11px}
.toggles{display:flex;border:1px solid var(--hair)}
.toggles button{flex:1;background:transparent;border:none;border-right:1px solid var(--hair);
 color:var(--dim);font:inherit;font-size:8px;letter-spacing:.1em;padding:7px 0;cursor:pointer;text-transform:uppercase}
.toggles button:last-child{border-right:none}
.toggles button.on{background:var(--ox);color:#10140f}
.toggles button:hover:not(.on){color:var(--ox2)}
.krow{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0;
 font-size:8px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.krow b{color:var(--txt);font-weight:400;font-size:10px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:14px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:rgba(174,182,176,.5)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:15px;
 background:linear-gradient(180deg,#e8ece6,#868e88 55%,#5f665f);margin-top:-7px}
input[type=range]::-moz-range-track{height:1px;background:rgba(174,182,176,.5)}
input[type=range]::-moz-range-thumb{width:7px;height:15px;background:linear-gradient(180deg,#e8ece6,#868e88 55%,#5f665f);border:none;border-radius:0}
.ops{display:flex;gap:1px;margin-top:2px}
.ops button{flex:1;background:transparent;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.16em;padding:7px 0;cursor:pointer;text-transform:uppercase}
.ops button:hover{color:var(--ox2);border-color:rgba(174,182,176,.5)}
/* crack-time table */
#table{width:100%;border-collapse:collapse;font-size:9px;letter-spacing:.14em}
#table td{padding:5px 2px;border-bottom:1px solid rgba(174,182,176,.1);text-transform:uppercase}
#table td:first-child{color:var(--dim)}
#table td:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--txt)}
#table td.last b{font-weight:400}
#trayToggle{position:fixed;right:30px;bottom:24px;z-index:14;background:var(--panel);border:1px solid var(--hair);
 color:var(--ox);font:inherit;font-size:8px;letter-spacing:.3em;padding:9px 14px;cursor:pointer;display:none;text-transform:uppercase}
#tray.hid+#trayToggle{display:block}
/* sheet */
#ov{position:fixed;inset:0;z-index:30;background:rgba(7,8,7,.96);display:none;overflow-y:auto;padding:6vh 4vw}
#ov.open{display:block}
#sheet{max-width:680px;margin:0 auto;border-top:1px solid var(--ox);padding:34px 40px 40px}
#sheet h2{font:italic 700 26px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;color:var(--ox2)}
#sheet .no{font-size:8px;letter-spacing:.38em;color:var(--dim);margin:6px 0 24px;text-transform:uppercase}
#sheet h4{font-size:9px;font-weight:400;letter-spacing:.36em;color:rgba(174,182,176,.6);margin:22px 0 8px;text-transform:uppercase}
#sheet p,#sheet li{font-size:12.5px;line-height:1.9;color:#c6cdc5;margin:8px 0}
#sheet ul{padding-left:16px}
#sheet code{color:var(--ox2);font:700 11.5px 'Courier New',monospace}
#sheet .fml{font:700 12px/2.1 'Courier New',monospace;color:var(--ox2);border:1px solid var(--hair);
 padding:12px 16px;margin:12px 0;white-space:pre;overflow-x:auto}
#sheet .sig{margin-top:28px;padding-top:12px;border-top:1px solid var(--hair);
 font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#close{float:right;background:none;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.28em;padding:6px 12px;cursor:pointer;text-transform:uppercase}
#close:hover{color:var(--ox2);border-color:rgba(174,182,176,.5)}
@media(max-width:940px){
 #verdict,#hint{display:none}
 #mark{top:56px;left:18px}#mark h1{font-size:22px}
 #gauge{top:120px;left:50%;transform:translateX(-50%)}
 #tray{right:12px;left:12px;bottom:12px;width:auto;max-height:52vh}
 #sheets{top:16px;right:18px}
 #trayToggle{right:12px;bottom:12px}
}
</style>

<canvas id="cv"></canvas>
<div id="stage"></div>

<script>
'use strict';
/* ============================================================
   SYSTEMS LABORATORY · ENTROPY STUDY No.26
   real entropy accounting · oxidized silver on graphite
   single file · zero dependencies
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

const POOLS=[
 {k:'lower', label:'a-z',  n:26},
 {k:'upper', label:'A-Z',  n:26},
 {k:'digit', label:'0-9',  n:10},
 {k:'symbol',label:'!@#$', n:33},
 {k:'space', label:'space',n:1},
 {k:'latin1',label:'accented', n:100},
];
const P={len:16,pool:{lower:true,upper:true,digit:true,symbol:true,space:false,latin1:false}};
const COMP=POOLS.map(p=>p.k);

function poolSize(){
 let n=0;
 for(const p of POOLS)if(P.pool[p.k])n+=p.n;
 return n;
}
function encState(){try{
 const o={l:P.len,p:POOLS.map(x=>P.pool[x.k]?1:0).join('')};
 return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return ''}}
function decState(q){try{const o=JSON.parse(atob(q.replace(/-/g,'+').replace(/_/g,'/')));
 if(typeof o.l==='number'&&isFinite(o.l))P.len=clamp(o.l|0,4,128);
 if(typeof o.p==='string'&&o.p.length===POOLS.length)
  POOLS.forEach((x,i)=>P.pool[x.k]=o.p[i]==='1');
 return true;}catch(e){return false}}
let hashT=0;
function saveHash(){const now=performance.now();if(now-hashT<800)return;hashT=now;
 try{history.replaceState(null,'','#'+encState())}catch(e){}}

/* ---------- pattern analysis: zxcvbn-style, simple and honest ---------- */
const COMMON=[
 'password','passw0rd','p@ssword','123456','12345678','123456789','1234','qwerty','qwerty123',
 'letmein','welcome','admin','login','abc123','iloveyou','monkey','dragon','sunshine','princess',
 'football','baseball','master','hello','freedom','whatever','trustno1','starwars','passwort',
 'azerty','zxcvbn','qwertz','asdasd','123123','654321','696969','123qwe','1q2w3e','qazwsx',
];
const COMMON_SET=new Set(COMMON);
const KEY_ROWS=['qwertyuiop','asdfghjkl','zxcvbnm','1234567890','azertyuiop','qwertzuiop'];
const YEARS=/(19[0-9]{2}|20[0-9]{2})/g;
const REPEAT=/^(.)\1{2,}$/;
const SEQUENCES=['abcdefghijklmnopqrstuvwxyz','0123456789','qwertyuiop','asdfghjkl','zxcvbnm'];

function lerp(a,b,t){return a+(b-a)*t;}
/* matched substring worth: bits an attacker saves by knowing the pattern */
function patternBits(s){
 const low=s.toLowerCase();
 const notes=[];
 let discount=0;
 if(COMMON_SET.has(low)){
  // rank among common list: earlier = weaker; cap discount at the token's whole alphabet cost
  const rank=COMMON.indexOf(low);
  const cost=Math.min(Math.log2(508000)+Math.log2(rank+1), s.length*Math.log2(26));
  notes.push({kind:'common password', bits:cost});
  discount+=cost;
  return {discount, notes};
 }
 // sequences (abc, 123, qwerty runs length>=3)
 for(const seq of SEQUENCES){
  for(let i=0;i<low.length;i++){
   for(let L=Math.min(low.length-i, seq.length);L>=3;L--){
    const seg=low.substr(i,L);
    const idx=seq.indexOf(seg);
    if(idx>=0){const bits=Math.log2(L*2*  (seq==='0123456789'?10:26)); 
     notes.push({kind:'keyboard/alpha sequence', bits});
     discount+=bits;i+=L-1;break;}
    const rev=[...seg].reverse().join('');
    if(seq.indexOf(rev)>=0){const bits=Math.log2(L*2*(seq==='0123456789'?10:26));
     notes.push({kind:'reversed sequence', bits});
     discount+=bits;i+=L-1;break;}
   }
  }
  if(notes.length)break;
 }
 // years
 let m,ym=/(19[0-9]{2}|20[0-9]{2})/g;
 while((m=ym.exec(low))){notes.push({kind:'year', bits:Math.log2(119)});discount+=Math.log2(119);}
 // dates xx yy
 if(/\b(0?[1-9]|[12][0-9]|3[01])(0?[1-9]|1[0-2])\d{2}\b/.test(low)){notes.push({kind:'date', bits:Math.log2(36500)});discount+=Math.log2(36500);}
 // repeats: aaa, abcabc
 const rep=/(.)\1{2,}/g;
 while((m=rep.exec(low))){
  const save=(m[0].length-1)*8;
  notes.push({kind:'repeat', bits:save});discount+=save;}
 const rep2=/(.{2,}?)\1{1,}/g;
 while((m=rep2.exec(low))){
  if(m[1].length>=2&&m[0].length>=4){const save=(m[0].length-m[1].length)*8;
   notes.push({kind:'echo repeat', bits:save});discount+=save;}}
 // leet: normalize then re-check common (charge only the substitution discount)
 const deleet=low.replace(/0/g,'o').replace(/1/g,'l').replace(/3/g,'e').replace(/4/g,'a')
  .replace(/5/g,'s').replace(/7/g,'t').replace(/@/g,'a').replace(/\$/g,'s').replace(/!/g,'i');
 if(!COMMON_SET.has(low)&&COMMON_SET.has(deleet)){
  const cost=Math.min(Math.log2(508000), s.length*Math.log2(26));
  notes.push({kind:'leetspeak of common word', bits:cost});discount+=cost;}
 // dictionary-lite: word fragments >=4 chars from common list
 if(!notes.length){
  for(const w of COMMON){
   if(w.length>=5&&low.includes(w)){const bits=Math.log2(508000)*0.4;
    notes.push({kind:'contains common word', bits});discount+=bits;break;}}
 }
 return {discount:Math.min(discount, s.length*11), notes};
}

/* ---------- the audit ---------- */
let AUDIT={bits:0,brutBits:0,notes:[],verdict:''};
function audit(text){
 const notes=[];
 if(!text){return {bits:0,brutBits:0,notes:[],verdict:'empty'};}
 // composition as typed
 const has={lower:/[a-z]/.test(text),upper:/[A-Z]/.test(text),digit:/[0-9]/.test(text),
  symbol:/[^a-zA-Z0-9 ]/.test(text),space:/ /.test(text)};
 let alpha=0;
 for(const p of POOLS)if(has[p.k])alpha+=p.n;
 alpha=Math.max(alpha,2);
 let brut=text.length*Math.log2(alpha);
 const {discount,notes:pn}=patternBits(text);
 notes.push(...pn);
 let bits=Math.max(1,brut-discount);
 // all-lowercase dictionary words without digits get the common-word discount scaled
 AUDIT={bits,brutBits:brut,notes,discount};
 return AUDIT;
}

/* ---------- crack cost: guesses = 2^bits / 2 on average ---------- */
const RIGS=[
 {k:'online',  label:'Online, throttled',  gps:1e2},       // 100 guesses/s
 {k:'gpu',     label:'Offline GPU rig',    gps:1e11},      // 100 GH/s
 {k:'nation',  label:'Nation-state cluster',gps:1e14},     // 100 TH/s
];
function fmtTime(sec){
 if(!isFinite(sec))return '∞ — heat death first';
 const u=[[1,'s'],[60,'min'],[3600,'h'],[86400,'d'],[86400*30.4,'mo'],[86400*365.25,'yr']];
 if(sec<1)return '< 1 s';
 if(sec<3600)return (sec|0)+' s';
 if(sec<86400)return (sec/3600).toFixed(1)+' h';
 if(sec<86400*365.25)return (sec/86400).toFixed(1)+' d';
 const yr=sec/(86400*365.25);
 if(yr<1e3)return yr.toFixed(0)+' yr';
 if(yr<1e6)return (yr/1e3).toFixed(1)+'k yr';
 if(yr<1e9)return (yr/1e6).toFixed(1)+'M yr';
 if(yr<1e12)return (yr/1e9).toFixed(1)+'B yr';
 if(yr<1e15)return (yr/1e12).toFixed(1)+'T yr';
 const ge=yr/5e9; // galactic years
 return (ge<1e6?(ge).toPrecision(3)+' galactic yr':'forever');
}

/* ---------- gauge: brushed-silver arc ---------- */
const dial=$('dial'),dctx=dial.getContext('2d');
function drawGauge(bits){
 const w=340,h=210,cx=w/2,cy=190,R=140;
 dctx.clearRect(0,0,w,h);
 const a0=Math.PI, a1=0;
 const frac=clamp(bits/128,0,1);
 // track
 dctx.lineWidth=10;dctx.lineCap='butt';
 dctx.strokeStyle='rgba(174,182,176,.12)';
 dctx.beginPath();dctx.arc(cx,cy,R,a0,a1);dctx.stroke();
 // ticks each 16 bits
 for(let b=0;b<=128;b+=16){
  const a=a0+(a1-a0)*(b/128);
  const c=Math.cos(a),s=Math.sin(a);
  dctx.strokeStyle='rgba(174,182,176,.35)';dctx.lineWidth=1;
  dctx.beginPath();dctx.moveTo(cx+c*(R-9),cy+s*(R-9));dctx.lineTo(cx+c*(R+9),cy+s*(R+9));dctx.stroke();
  dctx.fillStyle='rgba(130,138,131,.8)';dctx.font='8px Trebuchet MS,Verdana,sans-serif';
  dctx.textAlign='center';
  dctx.fillText(''+b,cx+c*(R+22),cy+s*(R+22)+3);
 }
 // value arc: brushed silver gradient
 const g=dctx.createLinearGradient(0,0,w,0);
 g.addColorStop(0,'#8a928c');g.addColorStop(.5,'#dfe4de');g.addColorStop(1,'#a9b1ab');
 dctx.strokeStyle=g;dctx.lineWidth=10;
 dctx.beginPath();dctx.arc(cx,cy,R,a0,a0+(a1-a0)*frac);dctx.stroke();
 // specular highlight
 dctx.strokeStyle='rgba(255,255,255,.25)';dctx.lineWidth=2;
 dctx.beginPath();dctx.arc(cx,cy,R-6,a0,a0+(a1-a0)*frac);dctx.stroke();
 // needle
 const na=a0+(a1-a0)*frac;
 dctx.strokeStyle='#e8ece6';dctx.lineWidth=2;
 dctx.beginPath();dctx.moveTo(cx,cy);
 dctx.lineTo(cx+Math.cos(na)*(R-20),cy+Math.sin(na)*(R-20));dctx.stroke();
 dctx.beginPath();dctx.arc(cx,cy,4,0,Math.PI*2);dctx.fillStyle='#dfe4de';dctx.fill();
 // readout
 dctx.fillStyle='#d6ddd6';dctx.font='italic 700 44px Didot,Bodoni MT,Playfair Display,Times New Roman,serif';
 dctx.textAlign='center';
 dctx.fillText(isFinite(bits)?bits.toFixed(1):'∞',cx,cy-38);
 dctx.fillStyle='rgba(130,138,131,.9)';dctx.font='8px Trebuchet MS,Verdana,sans-serif';
 dctx.fillText('BITS',cx,cy-24);
}

/* ---------- table ---------- */
function drawTable(bits){
 const box=$('table');
 if(!isFinite(bits)){box.innerHTML='';return;}
 const guesses=Math.pow(2,bits)/2;
 box.innerHTML='';
 for(const r of RIGS){
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${r.label}</td><td class="last"><b>${fmtTime(guesses/r.gps)}</b></td>`;
  box.appendChild(tr);
 }
}

/* ---------- verdict copy: terse, factual ---------- */
function verdictCopy(a){
 if(!a.bits)return '';
 const el=$('verdict');
 const rows=[];
 rows.push(`<b>${a.bits.toFixed(1)}</b> bits effective · <b>${a.brutBits.toFixed(1)}</b> raw · pattern discount <b>${a.discount.toFixed(1)}</b>`);
 for(const n of a.notes.slice(0,3))rows.push(`<span class="warn">pattern found: ${n.kind} (−${n.bits.toFixed(1)} bits)</span>`);
 if(!a.notes.length)rows.push('<span class="fine">no common patterns matched</span>');
 el.innerHTML=rows.join('<br>');
}

/* ---------- particle halo: entropy made visible ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
let grains=null,grainN=420;
function allocGrains(){
 grains=new Float32Array(grainN*4);
 for(let i=0;i<grainN;i++){
  grains[i*4]=Math.random()*Math.PI*2;   // angle
  grains[i*4+1]=.3+Math.random()*.9;     // radius factor
  grains[i*4+2]=(Math.random()-.5);      // jitter velocity
  grains[i*4+3]=.4+Math.random()*.6;     // brightness
 }
}
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastT=0;
function loop(t){
 const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
 ctx.fillStyle='#0a0b0a';ctx.fillRect(0,0,W,H);
 const cx=W*.5+ (innerWidth>940?-innerWidth*.08:0), cy=H*.42;
 const bits=AUDIT.bits;
 // grains orbit a silver core; spread grows with entropy until it dissolves
 const spread=clamp(bits/128,0,1);
 const baseR=Math.min(W,H)*.17*(0.4+spread*1.3);
 for(let i=0;i<grainN;i++){
  const o=i*4;
  grains[o]+= (dt*(.14+grains[o+2]*.3))*(1+spread*2);
  const rr=baseR*grains[o+1]*(1+.25*Math.sin(grains[o]*3+grains[o+2]*9));
  const x=cx+Math.cos(grains[o])*rr*1.25;
  const y=cy+Math.sin(grains[o])*rr*.8;
  const fade=clamp(1-spread*.4,.3,1)*grains[o+3];
  ctx.fillStyle=`rgba(${190+40*grains[o+3]|0},${196+40*grains[o+3]|0},${190+40*grains[o+3]|0},${(fade*(.5-spread*.25)).toFixed(3)})`;
  ctx.fillRect(x,y,1.6,1.6);
 }
 // core: brushed disc
 const coreR=26*(1-spread*.4);
 const g=ctx.createRadialGradient(cx-8,cy-8,2,cx,cy,coreR);
 g.addColorStop(0,'#eef1ec');g.addColorStop(.6,'#8f978f');g.addColorStop(1,'#22261f');
 ctx.fillStyle=g;
 ctx.beginPath();ctx.arc(cx,cy,coreR,0,Math.PI*2);ctx.fill();
 if(!REDUCED)requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
function seg(el,items,get,set){
 el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');
  b.textContent=it;b.onclick=()=>{set(it);sync();kick();};el.appendChild(b);});}
function knobs(){
 const box=$('knobs');box.innerHTML='';
 const wrap=document.createElement('div');
 const lab=document.createElement('div');lab.className='krow';
 lab.innerHTML='<span>Length</span><b></b>';
 const inp=document.createElement('input');inp.type='range';inp.min=4;inp.max=64;inp.step=1;inp.value=P.len;
 const val=lab.querySelector('b');
 const upd=()=>{val.textContent=''+P.len;};
 inp.addEventListener('input',()=>{P.len=parseInt(inp.value);upd();genFromDials();saveHash();});
 wrap.appendChild(lab);wrap.appendChild(inp);box.appendChild(wrap);
 inp._upd=upd;upd();}
function sync(){
 [...$('compSeg').children].forEach((b,i)=>b.classList.toggle('on',!!P.pool[POOLS[i].k]));
}
function refresh(){
 const text=$('pw').value;
 if(text){AUDIT=audit(text);}
 else{
  // no subject: audit the dials themselves
  const n=poolSize(),bits=P.len*Math.log2(Math.max(n,2));
  AUDIT={bits,brutBits:bits,notes:[],discount:0};
 }
 $('dialCap').textContent=$('pw').value?'bits of effective entropy':'bits by composition dials';
 drawGauge(AUDIT.bits);
 drawTable(AUDIT.bits);
 verdictCopy(AUDIT);
}
function kick(){refresh();}
function genFromDials(){
 const chars=[];
 for(const p of POOLS)if(P.pool[p.k])for(let i=0;i<p.n;i++){
  let c;
  if(p.k==='space')c=' ';
  else if(p.k==='lower')c=String.fromCharCode(97+i);
  else if(p.k==='upper')c=String.fromCharCode(65+i);
  else if(p.k==='digit')c=String.fromCharCode(48+i);
  else if(p.k==='symbol')c='!@#$%^&*()-_=+[]{};:,.<>?/~'.charAt(i%33);
  else c=String.fromCharCode(0xC0+i);
  chars.push(c);}
 if(!chars.length)return;
 const arr=new Uint32Array(P.len);crypto.getRandomValues(arr);
 let out='';
 for(let i=0;i<P.len;i++)out+=chars[arr[i]%chars.length];
 $('pw').value=out;
}
const CONCEPT=`
<h2>Concept</h2><div class="no">Study No.26 · guesswork accounting · Systems Laboratory</div>
<p>Strength is not a feeling. It is a cost: how many guesses an attacker must spend, on named hardware, before the secret falls. The study computes that cost and shows it.</p>
<h4>The raw budget</h4>
<div class="fml">bits = length × log2(alphabet size)</div>
<p>Alphabet is counted from the composition actually present: 26 lowercase, 26 uppercase, 10 digits, 33 symbols, 100 accented. Each additional bit doubles the search space.</p>
<h4>Patterns are discounts</h4>
<p>An attacker does not search blind. Known passwords, keyboard runs, years, dates, repeats and leetspeak let the search skip whole regions. Each recognized pattern removes bits:</p>
<div class="fml">effective bits = raw bits − Σ pattern discounts</div>
<div class="fml">guesses ≈ 2^bits / 2        time = guesses / rate</div>
<p>The table prices the secret against three named hardware classes: a throttled online endpoint at 100 guesses/s, an offline GPU rig at 100 GH/s, a nation-state cluster at 100 TH/s.</p>
<h4>What the gauge shows</h4>
<ul><li>0-28 bits: falls in seconds to hours even online.</li>
<li>28-50 bits: days to years against a GPU rig; hours against a cluster.</li>
<li>50-75 bits: decades and up, offline.</li>
<li>75+ bits: not brute-forceable; only theft, phishing or a breach leak the secret.</li></ul>
<p>Sixteen random characters from a 95-character alphabet: 105 raw bits, no discounts, unbreakable by hardware that exists. One common word with a year appended: 30-45 effective bits, dead by lunch. Length beats cleverness; randomness beats both.</p>
<div class="sig">Study No.26 · Systems Laboratory</div>`;
const BUILD=`
<h2>Build record</h2><div class="no">Maintainer's notes · Study No.26</div>
<p>One file, no libraries. The alphabet census, the pattern discounts and the cost table are local code.</p>
<h4>Notes</h4>
<ul><li>Pattern layer mirrors the public zxcvbn approach in miniature: common-password list with rank weighting, keyboard and alphabet sequences, years, dates, repeats, echo repeats, leetspeak normalization, substring matching against the common list.</li>
<li>Generator uses crypto.getRandomValues with rejection-free modulo over the selected composition.</li>
<li>Hardware rates are conservative published figures: 100/s throttled online, 1e11/s single high-end GPU cracking MD5-class fast hashes, 1e14/s cluster. Argon2 or bcrypt divides GPU and cluster rates by 1e3-1e5; the direction of the correction is always toward safety.</li>
<li>The input is never stored, sent or logged. There is no network in this file.</li>
<li>Dials and composition serialize to the URL hash. The typed subject does not.</li></ul>
<h4>Reduced motion</h4>
<p>prefers-reduced-motion renders one static frame of the grain field.</p>
<div class="sig">Study No.26 · bench copy</div>`;

seg($('compSeg'),POOLS.map(p=>p.label),()=>null,it=>{
 const i=POOLS.findIndex(p=>p.label===it);

 if(Object.values(P.pool).filter(Boolean).length===1&&P.pool[k])return; // keep one alive
 P.pool[k]=!P.pool[k];sync();genFromDials();saveHash();});
knobs();
$('pw').addEventListener('input',refresh);
$('bGen').onclick=()=>{genFromDials();refresh();};
$('bClear').onclick=()=>{$('pw').value='';refresh();};

$('tCon').onclick=()=>openSheet(CONCEPT);
$('tBld').onclick=()=>openSheet(BUILD);

ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
