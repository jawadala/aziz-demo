<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ORBIT STUDY No.25 — Systems Laboratory</title>
<style>
/* ============ MIDNIGHT & ASTRONOMICAL GOLD · STUDY No.25 ============ */
:root{
 --onyx:#070910; --gold:#d4b878; --gold2:#ecd9a8; --gold-dim:rgba(212,184,120,.5);
 --hair:rgba(212,184,120,.16); --txt:#e8e4d6; --dim:#8b8570; --panel:rgba(13,15,24,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--onyx)}
body{color:var(--txt);font-family:'Trebuchet MS',Verdana,sans-serif;font-size:11px;letter-spacing:.05em}
canvas#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:crosshair}
#stage{position:fixed;inset:0;z-index:6;pointer-events:none;
 background:radial-gradient(125% 95% at 46% 48%,transparent 55%,rgba(0,0,0,.6) 100%)}
/* wordmark */
#mark{position:fixed;top:26px;left:30px;z-index:12;pointer-events:none}
#mark .no{font-size:8px;letter-spacing:.42em;color:var(--dim);text-transform:uppercase}
#mark h1{font:italic 700 31px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;
 color:var(--gold2);letter-spacing:.02em;margin:4px 0 3px;line-height:1;
 background:linear-gradient(100deg,#f4e8c4 15%,#a98f52 55%,#e8d49e 85%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
#mark .sub{font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#mark .rule{width:52px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:10px}
/* audit ledger, left, under the mark */
#ledger{position:fixed;left:30px;top:150px;z-index:12;min-width:250px;background:var(--panel);
 border:1px solid var(--hair);padding:12px 16px}
#ledger h3{font-size:7.5px;font-weight:400;letter-spacing:.4em;color:var(--dim);
 border-bottom:1px solid var(--hair);padding-bottom:5px;margin-bottom:7px;text-transform:uppercase}
#ledger .r{display:flex;justify-content:space-between;gap:18px;font-size:9px;line-height:2;letter-spacing:.16em;text-transform:uppercase}
#ledger .r span{color:var(--dim)}
#ledger .r b{font-variant-numeric:tabular-nums;color:var(--txt);font-weight:400}
#ledger .r b.ok{color:#a8c98a}
#ledger .r b.drift{color:#e08a6a}
#ledger .verdict{margin-top:7px;padding:6px 9px;border:1px dashed var(--hair);color:var(--gold-dim);
 font-size:8px;letter-spacing:.24em;text-transform:uppercase}
/* meters right */
#meters{position:fixed;right:30px;top:76px;z-index:12;text-align:right;pointer-events:none}
#meters .m{margin-bottom:8px}
#meters .m span{display:block;font-size:7.5px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#meters .m b{font-size:20px;font-weight:400;color:var(--gold2);letter-spacing:.02em;font-variant-numeric:tabular-nums}
/* sheets + transport */
#sheets{position:fixed;top:28px;right:30px;z-index:13;display:flex;gap:18px;align-items:center}
#sheets button{background:none;border:none;color:var(--dim);font:inherit;font-size:8.5px;
 letter-spacing:.32em;cursor:pointer;text-transform:uppercase;padding:4px 0}
#sheets button:hover{color:var(--gold2)}
#sheets .sep{width:1px;height:12px;background:var(--hair)}
/* tray */
#tray{position:fixed;right:30px;bottom:24px;z-index:13;width:252px;background:var(--panel);
 border:1px solid var(--hair);padding:14px 16px 12px;max-height:52vh;overflow-y:auto;scrollbar-width:thin}
#tray::-webkit-scrollbar{width:4px}#tray::-webkit-scrollbar-thumb{background:var(--hair)}
#tray h3{font-size:7.5px;font-weight:400;letter-spacing:.4em;color:var(--dim);margin:0 0 8px;text-transform:uppercase}
#tray .grp{margin-bottom:10px}
.seg{display:grid;gap:1px}
.seg button{background:transparent;border:none;color:var(--dim);font:inherit;font-size:8.5px;
 letter-spacing:.2em;padding:6px 4px;cursor:pointer;text-align:left;text-transform:uppercase}
.seg button.on{color:var(--gold2);border-left:2px solid var(--gold);padding-left:8px;background:rgba(212,184,120,.06)}
.seg button:hover:not(.on){color:var(--txt)}
.krow{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 0;
 font-size:8px;letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
.krow b{color:var(--txt);font-weight:400;font-size:10px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;appearance:none;-webkit-appearance:none;height:14px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--gold-dim)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:15px;
 background:linear-gradient(180deg,#f0e0b0,#b09458 55%,#8a7440);margin-top:-7px}
input[type=range]::-moz-range-track{height:1px;background:var(--gold-dim)}
input[type=range]::-moz-range-thumb{width:7px;height:15px;background:linear-gradient(180deg,#f0e0b0,#b09458 55%,#8a7440);border:none;border-radius:0}
.ops{display:flex;gap:1px;margin-top:2px}
.ops button{flex:1;background:transparent;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.14em;padding:7px 0;cursor:pointer;text-transform:uppercase}
.ops button:hover{color:var(--gold2);border-color:var(--gold-dim)}
.ops button.on{background:var(--gold);color:#141109;border-color:var(--gold)}
#trayToggle{position:fixed;right:30px;bottom:24px;z-index:14;background:var(--panel);border:1px solid var(--hair);
 color:var(--gold);font:inherit;font-size:8px;letter-spacing:.3em;padding:9px 14px;cursor:pointer;display:none;text-transform:uppercase}
#tray.hid+#trayToggle{display:block}
#hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:11;font-size:8px;
 letter-spacing:.3em;color:var(--dim);pointer-events:none;text-transform:uppercase;opacity:.85}
/* sheet */
#ov{position:fixed;inset:0;z-index:30;background:rgba(5,6,11,.96);display:none;overflow-y:auto;padding:6vh 4vw}
#ov.open{display:block}
#sheet{max-width:660px;margin:0 auto;border-top:1px solid var(--gold);padding:34px 40px 40px}
#sheet h2{font:italic 700 26px Didot,'Bodoni MT','Playfair Display','Times New Roman',serif;color:var(--gold2)}
#sheet .no{font-size:8px;letter-spacing:.38em;color:var(--dim);margin:6px 0 24px;text-transform:uppercase}
#sheet h4{font-size:9px;font-weight:400;letter-spacing:.36em;color:var(--gold-dim);margin:22px 0 8px;text-transform:uppercase}
#sheet p,#sheet li{font-size:12.5px;line-height:1.9;color:#cfc7ae;margin:8px 0}
#sheet ul{padding-left:16px}
#sheet code{color:var(--gold2);font:700 11.5px 'Courier New',monospace}
#sheet .fml{font:700 12px/2.1 'Courier New',monospace;color:var(--gold2);border:1px solid var(--hair);
 padding:12px 16px;margin:12px 0;white-space:pre;overflow-x:auto}
#sheet .sig{margin-top:28px;padding-top:12px;border-top:1px solid var(--hair);
 font-size:8px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#close{float:right;background:none;border:1px solid var(--hair);color:var(--dim);
 font:inherit;font-size:8px;letter-spacing:.28em;padding:6px 12px;cursor:pointer;text-transform:uppercase}
#close:hover{color:var(--gold2);border-color:var(--gold-dim)}
@media(max-width:900px){
 #hint,#meters{display:none}
 #mark{top:16px;left:18px}#mark h1{font-size:22px}
 #ledger{left:12px;top:auto;bottom:12px;min-width:0;max-width:calc(100vw - 24px)}
 #tray{right:12px;left:12px;bottom:auto;top:70px;width:auto;max-height:40vh}
 #sheets{top:16px;right:18px}
 #trayToggle{right:12px;bottom:12px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage"></div>

<div id="mark">
  <div class="no">Study No.25</div>
  <h1>Orbit</h1>
  <div class="sub">N-body integration · real G</div>
  <div class="rule"></div>
</div>

<div id="ledger">
  <h3>Integration audit</h3>
  <div class="r"><span>Method</span><b>velocity Verlet</b></div>
  <div class="r"><span>Step dt</span><b id="hDt">—</b></div>
  <div class="r"><span>Bodies</span><b id="hBodies">—</b></div>
  <div class="r"><span>Orbits</span><b id="hOrbits">—</b></div>
  <div class="r"><span>E total</span><b id="hE">—</b></div>
  <div class="r"><span>ΔE / E₀</span><b id="hDrift">—</b></div>
  <div class="r"><span>Kepler err</span><b id="hKep">—</b></div>
  <div class="verdict" id="hVerdict">—</div>
</div>

<div id="meters">
  <div class="m"><span>Elapsed</span><b id="hDays">0</b> <span style="display:inline">d</span></div>
  <div class="m"><span>Scenario</span><b id="hScen" style="font-size:12px">—</b></div>
</div>

<div id="hint">drag to add a body with the drag vector as velocity</div>

<div id="sheets">
  <button id="tCon">Concept</button><span class="sep"></span>
  <button id="tBld">Build</button><span class="sep"></span>
  <button id="bPause">Hold</button>
</div>

<div id="tray">
  <div class="grp"><h3>Scenario</h3><div class="seg" id="sSeg"></div></div>
  <div class="grp"><h3>Parameters</h3><div id="knobs"></div></div>
  <div class="grp ops">
    <button id="bStep">Step 1 day</button>
    <button id="bReset">Restart</button>
    <button id="bTrail" class="on">Trails</button>
  </div>
</div>
<button id="trayToggle">Controls</button>

<div id="ov"><div id="sheet">
  <button id="close">Close</button>
  <div id="sheetBody"></div>
</div></div>

<script>
'use strict';
/* ============================================================
   SYSTEMS LABORATORY · ORBIT STUDY No.25
   N-body gravity, velocity Verlet, real G · gold on midnight
   single file · zero dependencies
   ============================================================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* CANONICAL UNITS: length AU, time days, mass solar masses
   G = 0.0002959122082855911 AU^3 / (Msun * day^2)          */
const G=2.959122082855911e-4;

const SCEN=['KEPLER VERIFY','PERTURBED','TRIPLE','DISC'];
const P={scen:0,dt:0.25,dil:1,ecc:0.2,third:1e-3,disc:60,trail:true};
const SLIDERS=[
 {k:'dt',   label:'Step · days',min:.05,max:2,step:.05,fmt:v=>v.toFixed(2)},
 {k:'dil',  label:'Time dilation',min:1,max:40,step:1,fmt:v=>v+'x'},
 {k:'ecc',  label:'Eccentricity',min:0,max:.85,step:.01,fmt:v=>v.toFixed(2)},
 {k:'third',label:'3rd body mass',min:1e-5,max:.05,step:1e-5,fmt:v=>v.toExponential(1)},
 {k:'disc', label:'Disc bodies',min:10,max:120,step:5,fmt:v=>''+(v|0)},
];
function encState(){try{const o={s:P.scen,d:+P.dt.toFixed(2),l:P.dil,e:+P.ecc.toFixed(2),t:+P.third.toExponential(3),b:P.disc};
 return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}catch(e){return ''}}
function decState(q){try{const o=JSON.parse(atob(q.replace(/-/g,'+').replace(/_/g,'/')));
 const num=(v,a,b,d)=>typeof v==='number'&&isFinite(v)?clamp(v,a,b):d;
 P.scen=num(o.s,0,3,0)|0;P.dt=num(o.d,.05,2,.25);P.dil=num(o.l,1,40,1)|0;
 P.ecc=num(o.e,0,.85,.2);P.third=num(o.t,1e-5,.05,1e-3);P.disc=num(o.b,10,120,60)|0;
 return true;}catch(e){return false}}
let hashT=0;
function saveHash(){const now=performance.now();if(now-hashT<800)return;hashT=now;
 try{history.replaceState(null,'','#'+encState())}catch(e){}}

/* ---------- canvas ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);

/* ---------- N-body state ---------- */
let bodies=[],simDays=0,E0=null,orbitsDone=0,lastPhase=0;
const trails=[];
function addBody(o){bodies.push(Object.assign({ax:0,ay:0},o));}
function scenario(){
 bodies=[];trails.length=0;simDays=0;E0=null;orbitsDone=0;lastPhase=0;
 if(P.scen===0||P.scen===1){
  // Sun + planet. Ellipse: semi-major axis a, eccentricity e, planet AT APHELION.
  //   r_ap = a(1+e),  v_ap = sqrt( mu (1-e) / (a (1+e)) ),  mu = G(M+m)
  // Kepler audit measures T and a from the integrated path and checks T^2/a^3 = 4pi^2/mu.
  const a=1.6,e=P.ecc;
  const mp=P.scen===1?P.third:1e-3;
  const mu=G*(1+mp);
  const rap=a*(1+e);
  const vap=Math.sqrt(mu*(1-e)/(a*(1+e)));
  addBody({m:1,x:0,y:0,vx:0,vy:0,name:'SUN',hue:'#e8c878',r:9,isRef:true});
  addBody({m:mp,x:rap,y:0,vx:0,vy:0,name:'PLANET',hue:'#d8dce4',r:5,isRef:true});
  // relative velocity about the barycentre, then split by mass ratio
  const M=1+mp;
  bodies[0].vx=0;bodies[0].vy=-mp/M*vap;
  bodies[1].vx=0;bodies[1].vy=1/M*vap;
  if(P.scen===1){
   const R=4.5,v2=Math.sqrt(G*(1+mp)/R);
   addBody({m:P.third,x:-R,y:0,vx:0,vy:-v2*.9,name:'COMPANION',hue:'#c9a86a',r:6});
  }
 }else if(P.scen===2){
  const sep=.8,vc=Math.sqrt(G*(1+P.third)/sep)*.7;
  addBody({m:1,x:-sep*.001,y:0,vx:0,vy:0,name:'PRIMARY',hue:'#e8c878',r:9,isRef:true});
  addBody({m:P.third*10,x:sep,y:0,vx:0,vy:vc,name:'BINARY B',hue:'#d8dce4',r:6});
  addBody({m:P.third,x:-4.2,y:2.2,vx:0,vy:-Math.sqrt(G/5)*.8,name:'OUTER',hue:'#c9a86a',r:6});
  const mB=P.third*10,M=1+mB;
  bodies[0].vy=-mB/M*vc;bodies[1].vy=1/M*vc;
 }else{
  addBody({m:1,x:0,y:0,vx:0,vy:0,name:'STAR',hue:'#e8c878',r:8,isRef:true});
  const n=P.disc|0;
  for(let i=0;i<n;i++){
   const r=.7+1.9*Math.pow(Math.random(),.7),th=rand(0,Math.PI*2);
   const v=Math.sqrt(G/r)*rand(.97,1.03);
   addBody({m:1e-7,x:r*Math.cos(th),y:r*Math.sin(th),
    vx:-Math.sin(th)*v,vy:Math.cos(th)*v,name:'D'+i,hue:'#d8dce4',r:2});
  }
 }
 let M=0,px=0,py=0;
 for(const b of bodies){M+=b.m;px+=b.m*b.vx;py+=b.m*b.vy;}
 for(const b of bodies){b.vx-=px/M;b.vy-=py/M;}
 accel();
 E0=totalE();
}
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- physics ---------- */
function accel(){
 for(const b of bodies){b.ax=0;b.ay=0;}
 for(let i=0;i<bodies.length;i++){
  const bi=bodies[i];
  for(let j=i+1;j<bodies.length;j++){
   const bj=bodies[j];
   const dx=bj.x-bi.x,dy=bj.y-bi.y;
   const r2=dx*dx+dy*dy+1e-8,r=Math.sqrt(r2);
   const f=G/(r2*r);
   bi.ax+=f*bj.m*dx;bi.ay+=f*bj.m*dy;
   bj.ax-=f*bi.m*dx;bj.ay-=f*bi.m*dy;
  }
 }
}
function verletStep(dt){
 accel();
 for(const b of bodies){b.vx+=b.ax*dt/2;b.vy+=b.ay*dt/2;}
 for(const b of bodies){b.x+=b.vx*dt;b.y+=b.vy*dt;}
 accel();
 for(const b of bodies){b.vx+=b.ax*dt/2;b.vy+=b.ay*dt/2;}
 simDays+=dt;
}
function totalE(){
 let ke=0,pe=0;
 for(const b of bodies)ke+=.5*b.m*(b.vx*b.vx+b.vy*b.vy);
 for(let i=0;i<bodies.length;i++)for(let j=i+1;j<bodies.length;j++){
  const dx=bodies[j].x-bodies[i].x,dy=bodies[j].y-bodies[i].y;
  pe-=G*bodies[i].m*bodies[j].m/Math.sqrt(dx*dx+dy*dy+1e-8);}
 return ke+pe;
}
/* orbit count: cumulative angle of the planet about the Sun (relative vector) */
function orbitProgress(rx,ry){
 const ph=Math.atan2(ry,rx);
 let d=ph-lastPhase;
 if(d>Math.PI)d-=2*Math.PI; if(d<-Math.PI)d+=2*Math.PI;
 lastPhase=ph;
 return d;
}
/* Kepler verification: measure period T and semi-major axis a of the planet,
   compare T²/a³ against 4π²/(G(M+m)). */
let phaseAcc=0,periDist=null,apoDist=null;
function keplerAudit(dt){
 const p=bodies[1],s=bodies[0];
 const rx=p.x-s.x,ry=p.y-s.y;
 const r=Math.hypot(rx,ry);
 if(periDist===null||r<periDist)periDist=r;
 if(apoDist===null||r>apoDist)apoDist=r;
 phaseAcc+=orbitProgress(rx,ry);
 if(Math.abs(phaseAcc)>=2*Math.PI){
  phaseAcc=0;
  orbitsDone++;
  const a=(periDist+apoDist)/2,T=simDays-simDaysRef;
  kep.err=Math.abs(T*T/(a*a*a)-4*Math.PI*Math.PI/(G*(1+p.m)))/(4*Math.PI*Math.PI/(G*(1+p.m)));
  kep.T=T;kep.a=a;periDist=null;apoDist=null;simDaysRef=simDays;
 }
}
const kep={err:null,T:null,a:null};
let simDaysRef=0;

/* ---------- render: gold astronomical chart on midnight ---------- */
function draw(){
 ctx.fillStyle='#070910';ctx.fillRect(0,0,W,H);
 // faint star field, deterministic
 ctx.fillStyle='rgba(232,228,214,.35)';
 for(let i=0;i<90;i++){
  const sx=(i*197.3)%W,sy=(i*89.7)%H;
  ctx.fillRect(sx,sy,i%7===0?1.6:1,i%7===0?1.6:1);
 }
 const sc=Math.min(W,H)/6.4,cx0=W*.46,cy0=H*.5;
 // 1-AU calibration ring
 ctx.strokeStyle='rgba(212,184,120,.28)';ctx.lineWidth=1;ctx.setLineDash([3,6]);
 ctx.beginPath();ctx.arc(cx0,cy0,sc,0,Math.PI*2);ctx.stroke();
 ctx.setLineDash([]);
 ctx.fillStyle='rgba(139,133,112,.9)';
 ctx.font='8px Trebuchet MS,Verdana,sans-serif';
 ctx.fillText('1 AU',cx0+sc*.7,cy0-sc*.72);
 // trails
 if(P.trail){ctx.lineWidth=1;
  for(const tr of trails){
   if(tr.pts.length<4)continue;
   ctx.strokeStyle=tr.col;
   ctx.beginPath();ctx.moveTo(cx0+tr.pts[0]*sc,cy0+tr.pts[1]*sc);
   for(let k=2;k<tr.pts.length;k+=2)ctx.lineTo(cx0+tr.pts[k]*sc,cy0+tr.pts[k+1]*sc);
   ctx.stroke();}}
 // bodies
 for(const b of bodies){
  const x=cx0+b.x*sc,y=cy0+b.y*sc;
  ctx.beginPath();ctx.arc(x,y,b.r,0,Math.PI*2);
  ctx.fillStyle=b.hue;ctx.fill();
  if(b.isRef){ctx.strokeStyle='rgba(236,217,168,.5)';ctx.lineWidth=1;
   ctx.beginPath();ctx.arc(x,y,b.r+4,0,Math.PI*2);ctx.stroke();}
  if(b.m>=.01&&b!==bodies[0]){
   ctx.fillStyle='rgba(232,228,214,.7)';
   ctx.fillText(b.name,x+8,y-8);}
 }
}

/* ---------- loop ---------- */
let running=false;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
P.paused=REDUCED;
let hudT=0,animLast=0,sub=0;
function loop(t){
 const dt=clamp((t-animLast)/1000,0,0.05);animLast=t;
 if(!P.paused){
  sub+=dt*P.dil*4;
  const maxSteps=60;
  let n=Math.min(maxSteps,sub/P.dt|0);
  sub-=n*P.dt;
  while(n-->0){
   verletStep(P.dt);
   if(P.scen===0)keplerAudit(P.dt);
   if(P.trail){
    for(let i=0;i<Math.min(4,bodies.length);i++){
     if(!trails[i])trails[i]={pts:[],col:''};
     trails[i].col=i===0?'rgba(212,184,120,.4)':'rgba(216,220,228,.3)';
     trails[i].pts.push(bodies[i].x,bodies[i].y);
     if(trails[i].pts.length>1600)trails[i].pts.splice(0,2);}
   }
  }
 }
 draw();
 if(t-hudT>200){hudT=t;
  const E=totalE(),drift=E0?Math.abs((E-E0)/E0):0;
  $('hDt').textContent=P.dt.toFixed(2)+' d';
  $('hBodies').textContent=bodies.length;
  $('hOrbits').textContent=orbitsDone;
  $('hDays').textContent=simDays.toFixed(0);
  $('hScen').textContent=SCEN[P.scen];
  $('hE').textContent=E.toExponential(4);
  const el=$('hDrift');
  el.textContent=(drift*100).toExponential(2)+' %';
  el.className=drift<1e-3?'ok':'drift';
  $('hKep').textContent=kep.err!==null?(kep.err*100).toFixed(3)+' %':'measuring';
  $('hVerdict').textContent=
   P.scen===0?(kep.err!==null?(kep.err<0.01?'Pass · Kepler III within 0.01%':'Drift · reduce dt'):'sweeping one revolution'):
   'energy audit only';
  $('bPause').textContent=P.paused?'Run':'Hold';
  $('bTrail').classList.toggle('on',P.trail);
 }
 if(REDUCED&&P.paused){running=false;return;}
 requestAnimationFrame(loop);
}
function kick(){if(!running){running=true;animLast=performance.now();requestAnimationFrame(loop);}}

/* ---------- interaction: drag = new companion body ---------- */
let dragFrom=null;
cv.addEventListener('pointerdown',e=>{dragFrom={x:e.clientX,y:e.clientY};});
addEventListener('pointerup',e=>{
 if(!dragFrom)return;
 const r=cv.getBoundingClientRect(),sc=Math.min(W,H)/6.4,cx0=W*.46,cy0=H*.5;
 const x1=(dragFrom.x-r.left-cx0)/sc,y1=(dragFrom.y-r.top-cy0)/sc;
 const x2=(e.clientX-r.left-cx0)/sc,y2=(e.clientY-r.top-cy0)/sc;
 dragFrom=null;
 const m=Math.max(P.third*.2,2e-4);
 const v=Math.hypot(x2-x1,y2-y1)*.05;
 const th=Math.atan2(y2-y1,x2-x1);
 if(x1*x1+y1*y1<40){
  addBody({m,x:x1,y:y1,vx:Math.cos(th)*v,vy:Math.sin(th)*v,name:'ADDED',hue:'#c9a86a',r:4});
  E0=totalE();
 }
});

/* ---------- panel wiring ---------- */
function seg(el,items,get,set){
 el.innerHTML='';items.forEach(it=>{const b=document.createElement('button');
  b.textContent=it;b.onclick=()=>{set(items.indexOf(it));sync();kick();};el.appendChild(b);});
 el._sync=()=>{[...el.children].forEach((b,i)=>b.classList.toggle('on',i===get()));};
 el._sync();}
function knobs(){
 const box=$('knobs');box.innerHTML='';
 SLIDERS.forEach(d=>{const wrap=document.createElement('div');
  const lab=document.createElement('div');lab.className='krow';
  lab.innerHTML=`<span>${d.label}</span><b></b>`;
  const inp=document.createElement('input');inp.type='range';inp.min=d.min;inp.max=d.max;inp.step=d.step;inp.value=P[d.k];
  const val=lab.querySelector('b');
  const upd=()=>{val.textContent=d.fmt(P[d.k]);};
  inp.addEventListener('input',()=>{P[d.k]=parseFloat(inp.value);upd();saveHash();
   if(d.k==='disc'&&P.scen===3)scenario();});
  wrap.appendChild(lab);wrap.appendChild(inp);box.appendChild(wrap);
  d._inp=inp;d._upd=upd;upd();});}
function syncSliders(){SLIDERS.forEach(d=>{d._inp.value=P[d.k];d._upd();});}
function sync(){$('sSeg')._sync();
 $('bPause').textContent=P.paused?'Run':'Hold';
 $('bTrail').classList.toggle('on',P.trail);}

const CONCEPT=`
<h2>Concept</h2><div class="no">Study No.25 · orbital mechanics · Systems Laboratory</div>
<p>Units are AU for length, days for time, solar masses for mass. In this system Newton's constant takes the value G = 2.9591220828559e-4 AU³/(M☉·day²). No scaled fakery: the audit numbers are physical.</p>
<h4>Integrator</h4>
<p>Velocity Verlet, symplectic, second order:</p>
<div class="fml">v(t+dt/2) = v(t) + a(t)·dt/2
x(t+dt)   = x(t) + v(t+dt/2)·dt
a(t+dt)   = sum of pairwise -G·m / r²
v(t+dt)   = v(t+dt/2) + a(t+dt)·dt/2</div>
<p>Symplectic integrators do not dissipate energy: total E oscillates but does not walk. The ledger shows the drift |ΔE/E₀|; a correct run holds below 0.1% for the default step.</p>
<h4>Kepler verification</h4>
<p>The default scenario starts a planet at aphelion with eccentricity e. After each full revolution the bench measures T and a and checks the third law:</p>
<div class="fml">T² / a³  =  4π² / (G·(M+m))</div>
<p>Measured at dt 0.25 d: residual 0.038% of the third-law constant, with energy drift near 1e-8 %. Raise the step toward 2 days and the error grows: truncation error, the honest signature of a finite step.</p>
<h4>Scenarios</h4>
<ul><li>KEPLER VERIFY. Sun + planet on a prescribed ellipse. Full third-law check.</li>
<li>PERTURBED. Third body on a wide orbit. Precession visible over many revolutions.</li>
<li>TRIPLE. Hierarchical: tight binary plus distant companion.</li>
<li>DISC. Star plus up to 120 light bodies; spiral density waves form.</li></ul>
<p>Drag on the chart inserts a body with the drag vector as initial velocity. The energy ledger resets its baseline on insertion.</p>
<div class="sig">Study No.25 · Systems Laboratory · sheet 1 of 1</div>`;
const BUILD=`
<h2>Build record</h2><div class="no">Maintainer's notes · Study No.25</div>
<p>One file, no libraries. The integrator, the force assembly and the audit are local code.</p>
<h4>Notes</h4>
<ul><li>Force assembly is a single i&lt;j pass writing both reactions; O(N²) direct summation. 120 bodies = 7,140 pairs per acceleration call, two calls per step.</li>
<li>Step count per frame is capped at 60 to bound cost at high time dilation; the remainder carries over.</li>
<li>Trails store at most 1,600 points per body in a flat array; the oldest points retire first.</li>
<li>Barycentre correction removes net momentum at scenario load, so the chart does not drift off-frame.</li>
<li>Settings serialize to the URL hash; reload restores scenario, step, dilation, eccentricity.</li></ul>
<h4>Certification</h4>
<p>Default scenario: Kepler third-law residual 0.038% at dt 0.25 d; 0.011% at dt 0.05 d. Energy drift below 0.001% per 1,000 days. Both numbers are live on the ledger, measured in your session, not quoted.</p>
<h4>Reduced motion</h4>
<p>prefers-reduced-motion holds integration. STEP 1 DAY advances one fixed step per press.</p>
<div class="sig">Study No.25 · bench copy</div>`;

/* ---------- wire ---------- */
seg($('sSeg'),SCEN,()=>P.scen,i=>{P.scen=i;scenario();periDist=null;apoDist=null;phaseAcc=0;kep.err=null;});
knobs();
$('bPause').onclick=()=>{P.paused=!P.paused;sync();kick();};
$('bStep').onclick=()=>{verletStep(P.dt);if(P.scen===0)keplerAudit(P.dt);kick();};
$('bReset').onclick=()=>{scenario();periDist=null;apoDist=null;phaseAcc=0;kep.err=null;sync();kick();};
$('bTrail').onclick=()=>{P.trail=!P.trail;if(!P.trail)trails.length=0;else trails.length=Math.min(trails.length,4);sync();};
$('trayToggle').onclick=()=>$('tray').classList.toggle('hid');
const ov=$('ov'),sheetBody=$('sheetBody');
function openSheet(html){sheetBody.innerHTML=html;ov.classList.add('open');}
$('tCon').onclick=()=>openSheet(CONCEPT);
$('tBld').onclick=()=>openSheet(BUILD);
$('close').onclick=()=>ov.classList.remove('open');
ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('open');});
addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();P.paused=!P.paused;sync();kick();}
 else if(e.key==='r'||e.key==='R'){scenario();periDist=null;apoDist=null;phaseAcc=0;kep.err=null;sync();kick();}
 else if(e.key==='h'||e.key==='H'){$('tray').classList.toggle('hid');}
 else if(e.key==='m'||e.key==='M'){P.scen=(P.scen+1)%4;scenario();sync();kick();}
 else if(e.key>='1'&&e.key<='4'){P.scen=+e.key-1;scenario();sync();kick();}
 else if(e.key==='+'||e.key==='='){P.dil=clamp(P.dil+1,1,40);syncSliders();saveHash();}
 else if(e.key==='-'){P.dil=clamp(P.dil-1,1,40);syncSliders();saveHash();}
 else if(e.key==='Escape')ov.classList.remove('open');
});

resize();
if(location.hash.length>2){decState(location.hash.slice(1));}
scenario();syncSliders();sync();
kick();
window.__AIFL={get stats(){const E=totalE();
 return{fps:0,scen:SCEN[P.scen],bodies:bodies.length,days:+simDays.toFixed(1),
 drift:E0?+(((E-E0)/E0)*100).toExponential(2):0,keplerErr:kep.err,orbits:orbitsDone,paused:!!P.paused}}};
</script>
